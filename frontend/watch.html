<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor - Streaming</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="watch.css">
</head>
<body>
  <header>
    <h1><a href="index.html" style="color: inherit; text-decoration: none;">Streaming Platform</a></h1>
  </header>

  <main class="watch-main">
    <section class="content-section">
      <div class="video-container-player">
        <video id="main-video" controls width="100%">
          Tu navegador no soporta el elemento de video.
        </video>
      </div>
      
      <div class="video-info">
        <h2 id="video-title">Cargando título...</h2>
        <p id="video-category" class="category-tag"></p>
        <p id="video-description" class="video-desc"></p>
      </div>
      <section class="comments-section">
        <h3>Comentarios</h3>
        <form id="comment-form" class="comment-form">
          <input type="text" id="comment-author" placeholder="Tu nombre" required>
          <textarea id="comment-content" placeholder="Escribe un comentario..." rows="3" required></textarea>
          <button type="submit">Comentar</button>
        </form>
        
        <div id="comments-container" class="comments-list">
        </div>
      </section>
    </section>

    <aside class="recommendations-aside">
      <h3>Videos Recomendados</h3>
      <div id="recommendations-container" class="recommendations-grid">
      </div>
    </aside>
  </main>

  <script src="watch.js"></script>
</body>
</html>
